<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Vedansh Software Services | Society &amp; Education Management Software</title>
    <meta name="description" content="Vedansh Software Services builds practical society management and education management software for Indian housing societies, schools, and coaching institutes. Request a free demo." />

    <!-- Static Open Graph / Twitter fallbacks.
         This is a client-rendered SPA, so the per-page tags injected by
         components/Seo.tsx only exist after React runs - which link-preview
         crawlers (WhatsApp, Facebook, LinkedIn, Slack) do not do. Without
         these static tags, shared links render with no image and no
         description at all. Per-page tags still override these for anything
         that does execute JavaScript.
         NOTE: these URLs point at the temporary Vercel host and must be
         updated together with SITE_URL in components/Seo.tsx when the real
         domain goes live. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vedansh Software Services" />
    <meta property="og:title" content="Vedansh Software Services | Society &amp; Education Management Software" />
    <meta property="og:description" content="Practical society management and education management software for Indian housing societies, schools, and coaching institutes. Request a free demo." />
    <meta property="og:url" content="https://vedanshsoft-kzuq.vercel.app/" />
    <meta property="og:image" content="https://vedanshsoft-kzuq.vercel.app/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vedansh Software Services | Society &amp; Education Management Software" />
    <meta name="twitter:description" content="Practical society management and education management software for Indian housing societies, schools, and coaching institutes. Request a free demo." />
    <meta name="twitter:image" content="https://vedanshsoft-kzuq.vercel.app/og-default.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
